<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SelectBeam Bridge</title>
<style>
  body { font: 13px system-ui; width: 300px; margin: 0; padding: 14px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #555; }
  label { display: block; margin: 8px 0 4px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: 13px monospace; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; padding: 7px; cursor: pointer; }
  #status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f2f2f2; white-space: pre-wrap; }
  .ok { background: #e6f6ec !important; }
  .bad { background: #fdecec !important; }
  ol { padding-left: 18px; margin: 6px 0; color: #555; }
</style>
</head>
<body>
  <h1>SelectBeam Bridge</h1>
  <p>Link THIS chat tab to VS Code so sends reuse it instead of opening new tabs.</p>
  <ol>
    <li>In VS Code: <b>Ctrl+Shift+P → SelectBeam: Show Browser Bridge Status</b> (copies token).</li>
    <li>Paste token below, Save, then <b>Link this tab</b>.</li>
  </ol>
  <label for="port">Bridge port</label>
  <input id="port" type="number" value="51337" />
  <label for="token">Bridge token</label>
  <input id="token" type="text" placeholder="paste token from VS Code" autocomplete="off" />
  <div class="row">
    <button id="save">Save</button>
    <button id="link">Link this tab</button>
  </div>
  <div class="row">
    <button id="test">Test bridge</button>
  </div>
  <div id="status">Not checked yet.</div>
  <script src="popup.js"></script>
</body>
</html>
